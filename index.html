<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Hábitos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
            <!-- Sidebar / Área de ingreso -->
            <div class="col-12 col-md-4 col-lg-3 sidebar-panel p-4 p-md-5">
                <h1 class="h3 mb-4 fw-bold">Gestor Diarios</h1>
                <p class="mb-5 text-white-50">Administra tus actividades y hábitos desde este panel de control.</p>
                
                <form id="form-habito" class="d-flex flex-column gap-3 mb-3">
                    <div>
                        <label for="input-habito" class="form-label text-uppercase small fw-bold tracking-wider">Registrar Nuevo Hábito</label>
                        <input type="text" id="input-habito" class="form-control form-control-lg border-0 shadow-none" placeholder="Escribe aquí tu meta..." required>
                    </div>
                    <button type="submit" class="btn btn-warning fw-bold mt-3 text-uppercase py-2">Guardar Tarea</button>
                </form>
            </div>

            <!-- Área principal de listado -->
            <div class="col-12 col-md-8 col-lg-9 content-panel p-4 p-md-5">
                <h2 class="h5 mb-4 text-secondary text-uppercase fw-bold border-bottom pb-3">Tus Tareas Activas</h2>
                <ul id="lista-habitos" class="d-flex flex-column gap-3">
                    <!-- La lista se generará desde JS -->
                </ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
