<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis hábitos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-4 py-md-5">
        <div class="card border-0 shadow-sm rounded-4 app-card">
            <div class="card-body p-4 p-md-5">
                <header class="page-header mb-4">
                    <div>
                        <p class="text-uppercase small text-muted mb-2 fw-semibold tracking">Mi plan</p>
                        <h1 class="h3 mb-0 fw-bold">Mis hábitos</h1>
                    </div>
                </header>

                <div class="dashboard-layout">
                    <aside class="sidebar-panel">
                        <div class="stat-card">
                            <span>Total</span>
                            <strong id="total-habitos">0</strong>
                        </div>
                        <div class="stat-card">
                            <span>Hechos</span>
                            <strong id="habitos-completados">0</strong>
                        </div>
                        <div class="stat-card">
                            <span>Faltan</span>
                            <strong id="habitos-pendientes">0</strong>
                        </div>
                    </aside>

                    <main class="content-panel">
                        <div class="add-card">
                            <form id="form-habito" class="d-flex gap-2 habit-form">
                                <input type="text" id="input-habito" class="form-control" placeholder="Agregar hábito" required>
                                <button type="submit" class="btn btn-dark px-3">Agregar</button>
                            </form>
                        </div>

                        <ul id="lista-habitos" class="list-group list-group-flush lista-habitos">
                            <!-- La lista se genera con JS -->
                        </ul>
                    </main>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
