<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Hábitos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
            <!-- Sidebar / Área de ingreso -->
            <div class="col-12 col-md-4 col-lg-3 sidebar-panel p-4 p-md-5 d-flex flex-column justify-content-center">
                <h1 class="h2 mb-3 fw-bold title-accent">Gestor Diarios</h1>
                <p class="mb-5 text-white-50 small">Administra tus actividades con un enfoque minimalista y directo.</p>
                
                <form id="form-habito" class="d-flex flex-column gap-3 mb-3">
                    <div>
                        <label for="input-habito" class="form-label text-uppercase small fw-bold tracking-wider">Nuevo Hábito</label>
                        <input type="text" id="input-habito" class="form-control form-control-lg border-0 rounded-0 shadow-none" placeholder="¿Qué harás hoy?" required>
                    </div>
                    <button type="submit" class="btn btn-accent rounded-0 fw-bold mt-2 text-uppercase py-3">Agregar</button>
                </form>
            </div>

            <!-- Área principal de listado -->
            <div class="col-12 col-md-8 col-lg-9 content-panel p-4 p-md-5">
                <div class="header-panel">
                    <h2 class="h5 mb-0 text-black text-uppercase fw-bold border-bottom border-dark border-2 pb-3">Tareas Activas</h2>

                    <div class="resumen-habitos">
                        <div class="stat-card">
                            <span>Total</span>
                            <strong id="total-habitos">0</strong>
                        </div>
                        <div class="stat-card">
                            <span>Completadas</span>
                            <strong id="habitos-completados">0</strong>
                        </div>
                        <div class="stat-card">
                            <span>Pendientes</span>
                            <strong id="habitos-pendientes">0</strong>
                        </div>
                    </div>
                </div>

                <ul id="lista-habitos" class="d-flex flex-column gap-3 mt-4">
                    <!-- La lista se generará desde JS -->
                </ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
