<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Hábitos</title>
    <!-- Bootstrap CSS para cumplir con el requerimiento -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tablero de Hábitos</h1>
        
        <form id="form-habito" class="d-flex mb-3">
            <input type="text" id="input-habito" class="form-control me-2" placeholder="Ej: Tomar agua" required>
            <button type="submit" class="btn btn-primary">Agregar</button>
        </form>

        <ul id="lista-habitos">
            <!-- La lista se generará desde JS -->
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
